<app-nav-bar (openMenu)="openMenu($event)"></app-nav-bar>

<div style="display: flex; flex-direction: row;">
  <mat-sidenav-container>
    <mat-sidenav mode="over" [opened]="toggleMenu">
      <app-side-bar></app-side-bar>
    </mat-sidenav>
    <mat-sidenav-content class="w-100">
      <div class="container-fluid container-max">
        <div class="row">
          <div class="col-4">
            <div class="box-col">
              <h1 class="text-center mb-5 mt-5">Bienvenido a nuestro Centro de Transferencia </h1>
              <img class="logo__lab mt-5" src="./../../../assets/images/logoprv/{{authService.getProveed()}}.png"
                alt="">
            </div>
          </div>

          <div class="col-8">
            <div class="box-col">
              <h1 class="text-center mt-4 mb-4">Panel de Accesos</h1>

              <div class="panel-ventas panel-group" *ngIf="usuariopadre === 'MASTERPROV'">
                <h2 class="panel-title"><i class="fas fa-shopping-cart"></i> Ventas</h2>
                <div class="panel-grid">
                  <a class="panel-option" href="javascript:void(0)" (click)="navigateTo('/pedidos')">
                    <i class="fas fa-cart-plus"></i>
                    <span>Catálogo</span>
                  </a>
                  <a class="panel-option" href="javascript:void(0)" (click)="navigateTo('/cargar-pedidos')">
                    <i class="fas fa-upload"></i>
                    <span>Cargar pedidos desde archivo</span>
                  </a>
                </div>
              </div>

              <div class="panel-ventas panel-group">
                <h2 class="panel-title"><i class="fas fa-chart-line"></i> Reportes</h2>
                <div class="panel-grid">
                  <a class="panel-option" href="javascript:void(0)" (click)="navigateTo('/historialped')">
                    <i class="fas fa-circle-nodes"></i>
                    <span>Triangulaciones Efectuadas</span>
                  </a>
                  <a class="panel-option" href="javascript:void(0)" (click)="bajareporteunico()">
                    <i class="fas fa-user-tie"></i>
                    <span>Ventas del usuario</span>
                  </a>
                  <a class="panel-option" href="javascript:void(0)" (click)="bajareportemaster()" *ngIf="usuariopadre === 'MASTERPROV'">
                    <i class="fas fa-users"></i>
                    <span>Ventas totales</span>
                  </a>
                  <a class="panel-option" href="javascript:void(0)" (click)="bajareporteinv()">
                    <i class="fas fa-boxes"></i>
                    <span>Inventario</span>
                  </a>
                </div>
              </div>

              <div class="panel-admin panel-group" *ngIf="usuariopadre === 'MASTERPROV'">
                <h2 class="panel-title"><i class="fas fa-cog"></i> Administrativo</h2>
                <div class="panel-grid">
                  <a class="panel-option" href="javascript:void(0)" (click)="navigateTo('/admin')">
                    <i class="fas fa-chart-pie"></i>
                    <span>Resumen de ventas</span>
                  </a>
                  <a class="panel-option" href="javascript:void(0)" (click)="navigateTo('/admin/retenciones')">
                    <i class="fas fa-file-invoice-dollar"></i>
                    <span>Facturas Abonadas</span>
                  </a>
                </div>
              </div>

              <div class="panel-perfil panel-group">
                <h2 class="panel-title"><i class="fas fa-user"></i> Mi cuenta</h2>
                <div class="panel-grid">
                  <a class="panel-option" href="javascript:void(0)" (click)="navigateTo('/miperfil')">
                    <i class="fas fa-user-edit"></i>
                    <span>Perfil</span>
                  </a>
                  <a class="panel-option panel-logout" href="javascript:void(0)" (click)="logout()">
                    <i class="fas fa-sign-out-alt"></i>
                    <span>Cerrar sesión</span>
                  </a>
                </div>
              </div>

            </div>
          </div>
        </div>
      </div>
      <app-footer></app-footer>
    </mat-sidenav-content>
  </mat-sidenav-container>
</div>
